name: E2E Tests

on:
  push:
  pull_request:

jobs:
  test-e2e:
    name: kind — chart install, rollout, admission
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.18.4

      - name: Install kind
        run: go install sigs.k8s.io/kind@v0.29.0

      - name: Run e2e
        run: make test-e2e IMG=kaname-iam-operator:e2e
