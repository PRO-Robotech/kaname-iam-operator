name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    name: Unit, envtest, admission
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.18.4

      - name: Generated files are current
        run: make verify-generated

      - name: Run tests
        run: make test
