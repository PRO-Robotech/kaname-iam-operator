name: Lint

on:
  push:
  pull_request:

jobs:
  lint:
    name: golangci-lint and chart
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.18.4

      - name: golangci-lint (all build tags)
        run: make lint

      - name: Helm lint
        run: make helm-lint
