name: docker-build-and-push
on:
  push:
    branches:
      - "*"
      - feature/*
      - fix/*
      - release/*
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+rc[0-9]+"

jobs:
  docker-build-amd64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Source provenance before runtime checks
        run: |
          python3 -I - before <<'PY'
          import json
          import os
          import subprocess
          import sys

          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()

          phase = sys.argv[1]
          assert phase in ('before', 'after'), phase
          head = git('rev-parse', 'HEAD')
          assert head == os.environ['GITHUB_SHA'], 'source HEAD differs from event SHA'
          assert not git('status', '--porcelain', '--untracked-files=no'), 'tracked source changed'
          if phase == 'before':
              assert not git('ls-files', '--others', '--exclude-standard'), 'initial checkout has untracked files'
          print('OPERATOR_SOURCE_V1 ' + json.dumps({
              'phase': phase, 'head': head, 'tree': git('rev-parse', 'HEAD^{tree}'),
              'tracked_clean': True, 'run_id': int(os.environ['GITHUB_RUN_ID']),
              'run_attempt': int(os.environ['GITHUB_RUN_ATTEMPT']), 'job': os.environ['GITHUB_JOB'],
          }, sort_keys=True))
          PY

      - uses: benjlevesque/short-sha@v3.0
        id: short-sha
        with:
          length: 8

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          install: true

      - name: Configure Buildx cache
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.ref_name }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Create sanitized branch name
        id: sanitize
        run: echo "branch=$(echo ${GITHUB_REF_NAME} | sed 's/\//-/g')" >> "$GITHUB_OUTPUT"

      - name: Build and push kaname-iam-operator image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          provenance: false
          platforms: linux/amd64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}:${{ steps.sanitize.outputs.branch }}-${{ steps.short-sha.outputs.sha }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: Source provenance after runtime checks
        run: |
          python3 -I - after <<'PY'
          import json
          import os
          import subprocess
          import sys

          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()

          phase = sys.argv[1]
          assert phase in ('before', 'after'), phase
          head = git('rev-parse', 'HEAD')
          assert head == os.environ['GITHUB_SHA'], 'source HEAD differs from event SHA'
          assert not git('status', '--porcelain', '--untracked-files=no'), 'tracked source changed'
          if phase == 'before':
              assert not git('ls-files', '--others', '--exclude-standard'), 'initial checkout has untracked files'
          print('OPERATOR_SOURCE_V1 ' + json.dumps({
              'phase': phase, 'head': head, 'tree': git('rev-parse', 'HEAD^{tree}'),
              'tracked_clean': True, 'run_id': int(os.environ['GITHUB_RUN_ID']),
              'run_attempt': int(os.environ['GITHUB_RUN_ATTEMPT']), 'job': os.environ['GITHUB_JOB'],
          }, sort_keys=True))
          PY

      - name: Move new cache
        if: always()
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache
