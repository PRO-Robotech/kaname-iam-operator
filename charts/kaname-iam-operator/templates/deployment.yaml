apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kio.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kio.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "kio.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kio.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include "kio.config" . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      # Токен API нужен клиенту k8s оператора.
      automountServiceAccountToken: true
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: {{ include "kio.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --config=/etc/kaname-iam-operator/config.yaml
            - --leader-elect={{ .Values.leaderElection.enabled }}
            - --drift-interval={{ .Values.driftInterval }}
            - --max-concurrent-reconciles={{ .Values.maxConcurrentReconciles }}
            - --health-probe-bind-address=:8081
            - --witness-key-secret={{ include "kio.witnessKeySecret" . }}
            {{- if .Values.metrics.enabled }}
            - --metrics-bind-address=:{{ .Values.metrics.port }}
            - --metrics-secure=true
            {{- else }}
            - --metrics-bind-address=0
            {{- end }}
            - --zap-log-level={{ .Values.logLevel }}
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: SERVICE_ACCOUNT_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.serviceAccountName
          ports:
            - name: probes
              containerPort: 8081
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: probes
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: probes
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/kaname-iam-operator/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: vault-token
              mountPath: /var/run/secrets/vault
              readOnly: true
            {{- if .Values.kanameCA.secretName }}
            - name: kaname-ca
              mountPath: /etc/kaname-iam-operator/kaname-ca
              readOnly: true
            {{- end }}
            {{- if .Values.vaultCA.secretName }}
            - name: vault-ca
              mountPath: /etc/kaname-iam-operator/vault-ca
              readOnly: true
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "kio.fullname" . }}-config
        - name: vault-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: {{ .Values.vaultToken.audience | quote }}
                  expirationSeconds: {{ .Values.vaultToken.expirationSeconds }}
        {{- if .Values.kanameCA.secretName }}
        - name: kaname-ca
          secret:
            secretName: {{ .Values.kanameCA.secretName }}
        {{- end }}
        {{- if .Values.vaultCA.secretName }}
        - name: vault-ca
          secret:
            secretName: {{ .Values.vaultCA.secretName }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
