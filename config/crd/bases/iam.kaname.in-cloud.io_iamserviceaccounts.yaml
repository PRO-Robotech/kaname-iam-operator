---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: iamserviceaccounts.iam.kaname.in-cloud.io
spec:
  group: iam.kaname.in-cloud.io
  names:
    categories:
    - kaname-iam
    kind: IAMServiceAccount
    listKind: IAMServiceAccountList
    plural: iamserviceaccounts
    shortNames:
    - iamsa
    singular: iamserviceaccount
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.name
      name: KanameName
      type: string
    - jsonPath: .status.id
      name: ID
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].reason
      name: Reason
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: IAMServiceAccount — учётка kaname IAM с ключами, доставляемыми
          в Vault.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: IAMServiceAccountSpec — желаемое состояние учётки kaname.
            properties:
              deletionPolicy:
                default: Delete
                description: DeletionPolicy — что делать с учёткой kaname при удалении
                  CR.
                enum:
                - Delete
                - Orphan
                type: string
              description:
                description: Description — описание учётки.
                maxLength: 256
                type: string
              enabled:
                default: true
                description: |-
                  Enabled — включена ли учётка. Выключение зовёт `:disable`; включение
                  после отключения по spec — `:enable`; включение после ручного
                  отключения в kaname оператор сам НЕ делает (Drifted).
                type: boolean
              keys:
                description: Keys — ключи учётки, доставляемые в Vault.
                items:
                  description: KeySpec — один ключ учётки.
                  properties:
                    audience:
                      description: |-
                        Audience — сужение адресатов ключа (audience выпуска kaname). Только для
                        ключевой пары.
                      items:
                        maxLength: 256
                        minLength: 1
                        type: string
                      maxItems: 8
                      type: array
                      x-kubernetes-list-type: atomic
                    delivery:
                      description: 'Delivery — доставка удостоверения. Неизменяема:
                        другой путь — другой ключ.'
                      properties:
                        vault:
                          description: Vault — доставка в Vault KV v2.
                          properties:
                            app:
                              description: App — приложение из перечня доставки конфигурации
                                оператора.
                              maxLength: 63
                              pattern: ^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$
                              type: string
                            instance:
                              description: Instance — экземпляр приложения (DNS-метка).
                              maxLength: 63
                              pattern: ^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$
                              type: string
                          required:
                          - app
                          - instance
                          type: object
                      required:
                      - vault
                      type: object
                      x-kubernetes-validations:
                      - message: delivery is immutable
                        rule: self == oldSelf
                    kind:
                      default: Secret
                      description: 'Kind — вид удостоверения. Неизменяем: другой вид
                        — другой ключ.'
                      enum:
                      - Secret
                      - Keypair
                      type: string
                      x-kubernetes-validations:
                      - message: kind is immutable
                        rule: self == oldSelf
                    name:
                      description: Name — имя ключа внутри учётки.
                      maxLength: 32
                      pattern: ^[a-z]([a-z0-9-]{0,30}[a-z0-9])?$
                      type: string
                    rotation:
                      description: Rotation — ротация с перекрытием.
                      properties:
                        overlapSeconds:
                          description: |-
                            OverlapSeconds — сколько секунд прежний ключ живёт после выпуска замены;
                            0 — прежний ключ отзывается сразу.
                          format: int64
                          minimum: 0
                          type: integer
                        renewBeforeSeconds:
                          description: RenewBeforeSeconds — за сколько секунд до истечения
                            выпускается замена.
                          format: int64
                          minimum: 60
                          type: integer
                      type: object
                    ttlSeconds:
                      default: 2592000
                      description: TTLSeconds — срок ключа в секундах (ttl_seconds
                        выпуска kaname).
                      format: int64
                      maximum: 31536000
                      minimum: 3600
                      type: integer
                  required:
                  - delivery
                  - name
                  type: object
                  x-kubernetes-validations:
                  - message: ttlSeconds of a Secret key must be <= 7776000 (90 days)
                    rule: self.kind != 'Secret' || self.ttlSeconds <= 7776000
                  - message: audience is not meaningful for a Secret key
                    rule: self.kind != 'Secret' || !has(self.audience) || size(self.audience)
                      == 0
                  - message: rotation.renewBeforeSeconds must be less than ttlSeconds
                    rule: '!has(self.rotation) || !has(self.rotation.renewBeforeSeconds)
                      || self.rotation.renewBeforeSeconds < self.ttlSeconds'
                  - message: rotation.overlapSeconds must be less than ttlSeconds
                    rule: '!has(self.rotation) || !has(self.rotation.overlapSeconds)
                      || self.rotation.overlapSeconds < self.ttlSeconds'
                  - message: rotation.overlapSeconds must not exceed rotation.renewBeforeSeconds
                    rule: '!has(self.rotation) || !has(self.rotation.overlapSeconds)
                      || !has(self.rotation.renewBeforeSeconds) || self.rotation.overlapSeconds
                      <= self.rotation.renewBeforeSeconds'
                maxItems: 8
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              labels:
                additionalProperties:
                  type: string
                description: Labels — метки учётки в kaname. Префикс k8s.in-cloud.io/
                  занят оператором.
                maxProperties: 32
                type: object
                x-kubernetes-validations:
                - message: label prefix k8s.in-cloud.io/ is reserved for the operator
                  rule: self.all(k, !k.startsWith('k8s.in-cloud.io/'))
                - message: label keys must match ^[a-z][-_./@a-z0-9]{0,62}$
                  rule: self.all(k, k.matches('^[a-z][-_./@a-z0-9]{0,62}$'))
                - message: label values must be at most 63 characters
                  rule: self.all(k, size(self[k]) <= 63)
              name:
                description: Name — имя учётки в kaname, уникальное в аккаунте. Неизменяемо.
                maxLength: 63
                pattern: ^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$
                type: string
                x-kubernetes-validations:
                - message: spec.name is immutable
                  rule: self == oldSelf
            required:
            - name
            type: object
          status:
            description: IAMServiceAccountStatus — наблюдаемое состояние учётки.
            properties:
              accountId:
                description: |-
                  AccountID — аккаунт kaname, в котором учётка заведена. Записывается ДО
                  вызова создания (намерение): по нему удаление находит учётку, чей id
                  не дошёл до status.
                type: string
              conditions:
                description: Conditions — Ready, Synced, KeysReady, Drifted, Conflict.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              creatingSince:
                description: |-
                  CreatingSince — время намерения создать учётку: пишется ДО вызова
                  Create и снимается, когда исход создания известен (завершённая
                  операция либо учётка с этим именем в аккаунте). Пока оно есть и
                  kaname.createGrace не истёк, удаление CR не считает пустой поиск
                  доказательством, что учётки нет.
                format: date-time
                type: string
              disabledBySpec:
                description: |-
                  DisabledBySpec — учётку отключил оператор по spec.enabled=false.
                  Пишется ДО вызова отключения; по нему включение по spec отличается от
                  отключения мимо оператора: первое исполняется, второе — дрейф.
                type: boolean
              id:
                description: ID — id учётки в kaname (sva…).
                type: string
              keys:
                description: Keys — состояние ключей.
                items:
                  description: KeyStatus — наблюдаемое состояние ключа.
                  properties:
                    expiresAt:
                      description: ExpiresAt — срок действующего ключа.
                      format: date-time
                      type: string
                    issuing:
                      description: Issuing — незавершённый выпуск.
                      properties:
                        at:
                          description: At — момент записи намерения.
                          format: date-time
                          type: string
                        nonce:
                          description: Nonce — однократный признак выпуска.
                          type: string
                      required:
                      - at
                      - nonce
                      type: object
                    keyId:
                      description: KeyID — id действующего ключа в kaname.
                      type: string
                    name:
                      description: Name — имя ключа из spec.keys[].name.
                      type: string
                    previous:
                      description: Previous — прежний ключ в окне перекрытия.
                      properties:
                        keyId:
                          description: KeyID — id прежнего ключа в kaname.
                          type: string
                        revokeAt:
                          description: RevokeAt — когда прежний ключ отзывается.
                          format: date-time
                          type: string
                      required:
                      - keyId
                      - revokeAt
                      type: object
                    vaultPath:
                      description: VaultPath — путь записи Vault (mount/path), вычисленный
                        оператором.
                      type: string
                    vaultVersion:
                      description: VaultVersion — версия записи Vault KV v2 с действующим
                        ключом.
                      format: int64
                      type: integer
                  required:
                  - name
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              observedGeneration:
                description: ObservedGeneration — поколение spec, по которому выставлены
                  условия.
                format: int64
                type: integer
              pendingOperation:
                description: PendingOperation — незавершённая операция kaname.
                properties:
                  id:
                    description: ID — идентификатор операции kaname.
                    minLength: 1
                    type: string
                  startedAt:
                    description: StartedAt — момент запуска операции.
                    format: date-time
                    type: string
                  subject:
                    description: |-
                      Subject — предмет операции внутри объекта (имя ключа, id выдачи), если он
                      не равен самому объекту.
                    type: string
                  verb:
                    description: Verb — что делает операция.
                    enum:
                    - Create
                    - Update
                    - Disable
                    - Enable
                    - Delete
                    - IssueKey
                    - RevokeKey
                    - Revoke
                    type: string
                required:
                - id
                - startedAt
                - verb
                type: object
              resyncNonce:
                description: |-
                  ResyncNonce — значение аннотации resync-drift, по которому восстановление
                  уже выполнено.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
