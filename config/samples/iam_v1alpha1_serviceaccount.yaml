# Учётка CI-робота реестра abc123: ключ SECRET в Vault приложения docker-registry.
apiVersion: iam.kaname.in-cloud.io/v1alpha1
kind: ServiceAccount
metadata:
  name: zot-abc123-ci
  namespace: cust01
spec:
  name: zot-abc123-ci
  description: CI robot of registry abc123
  labels:
    registry: abc123
  keys:
    - name: push
      kind: Secret
      ttlSeconds: 2592000
      delivery:
        vault:
          app: docker-registry
          instance: abc123
